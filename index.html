<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Wedding Envelope Animation</title>
    <link href="https://fonts.googleapis.com/css?family=Dancing+Script:700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Wedding Invitation</h1>
        <p class="subtitle">Hover over the envelope to open</p>
        
        <div class="envelope-wrapper">
            <div class="envelope">
                <div class="flap"></div>
                <div class="front"></div>
                <div class="letter">
                    <div class="invitation">
                        <h2>You're Invited!</h2>
                        <p>To the wedding of<br><strong>Emma & Liam</strong></p>
                        <span>June 21, 2026</span>
                        <p class="details">
                            Garden Estate<br>
                            Sunset Venue<br>
                            6:00 PM
                        </p>
                    </div>
                </div>
            </div>
        </div>
        
        <footer>
            <p>💌 RSVP by June 14, 2026</p>
        </footer>
    </div>
</body>
</html>
